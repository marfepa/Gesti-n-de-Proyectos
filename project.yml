name: PlanAI
options:
  bundleIdPrefix: com.planai
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  PlanAI:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: PlanAI
    settings:
      base:
        PRODUCT_NAME: PlanAI
        PRODUCT_BUNDLE_IDENTIFIER: com.planai.app
        INFOPLIST_FILE: PlanAI/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
    frameworks:
      - framework: SwiftUI.framework
      - framework: SwiftData.framework
      - framework: Charts.framework
      - framework: AVFoundation.framework
      - framework: Speech.framework
      - framework: FoundationModels.framework
        optional: true

  PlanAITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PlanAITests
    dependencies:
      - target: PlanAI
